<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOCKER - Explorar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/style.css">
</head>
<body class="explore-page" data-page="explore">
    <header class="navbar">
        <div class="navbar-content">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M9 2L14 5.5V12.5L9 16L4 12.5V5.5L9 2Z" fill="#0C0C0E" />
                        <path d="M6.5 7.5H11.5M9 7.5V13" stroke="#0C0C0E" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </div>
                <span class="logo-text">THE LOCKER</span>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5" />
                        <path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    <input type="text" class="search-input" placeholder="Buscar atletas, equipes, treinos...">
                </div>
            </div>

            <div class="nav-actions">
                <button class="nav-icon-btn" aria-label="Notificações">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M9 2C6.24 2 4 4.24 4 7v4l-1.5 2h13L14 11V7c0-2.76-2.24-5-5-5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                        <path d="M7 15c0 1.1.9 2 2 2s2-.9 2-2H7Z" stroke="currentColor" stroke-width="1.5" />
                    </svg>
                    <span class="notif-dot"></span>
                </button>
                <button class="nav-icon-btn" aria-label="Mensagens">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M2 3h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5l-3 3V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    </svg>
                </button>
                <a class="profile-btn" href="/public/profile.html" aria-label="Meu perfil">
                    <img class="current-user-avatar" src="" alt="">
                </a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <a class="nav-item" data-id="feed" href="/public/index.html">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                        <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                        <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                        <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
                    </svg>
                    Feed
                </a>
                <a class="nav-item" data-id="explore" href="/public/explore.html">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5" />
                        <path d="M13 7l-2.5 5.5L5 13l3-5.5L13 7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    </svg>
                    Explorar
                </a>
                <a class="nav-item" data-id="training" href="/public/training.html">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M3 10h2m10 0h2M7 10h6M5 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                        <path d="M7 7v6M13 7v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    Treinos
                </a>
                <button class="nav-item" data-id="teams" disabled title="Em breve">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.5" />
                        <circle cx="13" cy="7" r="3" stroke="currentColor" stroke-width="1.5" />
                        <path d="M1 17c0-3.31 2.69-6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                        <path d="M13 11c3.31 0 6 2.69 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    Times
                </button>
                <button class="nav-item" data-id="stats" disabled title="Em breve">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M3 17V9M8 17V5M13 17v-6M18 17v-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    Estatísticas
                </button>
                <button class="nav-item" data-id="events" disabled title="Em breve">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="2.5" y="3.5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="1.5" />
                        <path d="M2.5 8h15M7 2v3M13 2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    Eventos
                </button>
            </nav>

            <button class="post-btn">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Nova Postagem
            </button>

            <div class="my-teams">
                <p class="section-title">Meus Times</p>
                <div class="teams-list" id="my-teams-list"></div>
            </div>
        </aside>

        <main class="content">
            <div class="explore-layout">
                <!-- Filters -->
                <section class="panel-card explore-filters">
                    <p class="panel-title">Filtros</p>
                    <div class="filter-group">
                        <label class="filter-label" for="sport-filter">Esporte</label>
                        <select class="filter-select" id="sport-filter">
                            <option value="">Todos os esportes</option>
                            <option value="natacao">Natação</option>
                            <option value="corrida">Corrida</option>
                            <option value="ciclismo">Ciclismo</option>
                            <option value="crossfit">CrossFit</option>
                            <option value="futebol">Futebol</option>
                            <option value="musculacao">Musculação</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="level-filter">Nível</label>
                        <select class="filter-select" id="level-filter">
                            <option value="">Todos os níveis</option>
                            <option value="iniciante">Iniciante</option>
                            <option value="intermediario">Intermediário</option>
                            <option value="avancado">Avançado</option>
                            <option value="profissional">Profissional</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="location-filter">Localização</label>
                        <input type="text" class="filter-input" id="location-filter" placeholder="Cidade ou estado...">
                    </div>
                </section>

                <!-- Results -->
                <section class="explore-results">
                    <div class="results-section">
                        <p class="panel-title">Atletas Populares</p>
                        <div class="athletes-grid" id="athletes-grid"></div>
                    </div>

                    <div class="results-section">
                        <p class="panel-title">Próximos Eventos</p>
                        <div class="events-list-explore" id="events-list-explore"></div>
                    </div>

                    <div class="results-section">
                        <p class="panel-title">Trending</p>
                        <div class="trending-tags" id="trending-tags"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
