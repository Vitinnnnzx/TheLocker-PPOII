<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — TheLocker</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link
      rel="shortcut icon"
      href="./static/img/FaviconTlock.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-visual">
        <a class="brand" href="/"><span class="brand-mark"></span>THE LOCKER</a>
        <div>
          <div class="tagline">
            Todo atleta merece <span class="accent">o holofote certo</span>.
          </div>
          <div class="stat-row" style="margin-top: 26px">
            <div class="stat"><b>+1</b><span>plataforma dedicada</span></div>
            <div class="stat"><b>ODS 8</b><span>trabalho decente</span></div>
            <div class="stat">
              <b>ODS 10</b><span>redução de desigualdades</span>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-form-side">
        <div class="auth-box">
          <a class="auth-back" href="/" id="auth-back-link"
            ><span id="auth-back-icon"></span>Voltar ao início</a
          >
          <h1>Bem-vindo de volta</h1>
          <p class="sub">Entre para acompanhar o feed e seu perfil.</p>

          <div class="form-error" id="form-error"></div>

          <form id="login-form">
            <div class="field">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="voce@email.com"
                required
                autocomplete="email"
              />
            </div>
            <div class="field">
              <label for="senha">Senha</label>
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-full"
              id="submit-btn"
            >
              Entrar
            </button>
          </form>

          <div class="auth-switch">
            Ainda não tem conta? <a href="/criar-conta">Criar conta</a><br />
            É um time? <a href="/criar-time">Cadastre seu time</a>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/js/icons.js"></script>
    <script>
      document.getElementById("auth-back-icon").innerHTML = ICONS.arrowLeft;
    </script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/login.js"></script>
  </body>
</html>
