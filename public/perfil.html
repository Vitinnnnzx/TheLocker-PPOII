<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu perfil — TheLocker</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link
      rel="shortcut icon"
      href="./static/img/FaviconTlock.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar-mount"></aside>
      <header class="topbar" id="topbar-mount"></header>

      <div class="content narrow">
        <main class="main-col" style="max-width: 680px">
          <div class="profile-cover"></div>
          <div class="card profile-card" id="profile-card">
            <div class="loading-row">Carregando perfil...</div>
          </div>

          <div class="tab-row">
            <button class="tab active" data-tab="postagens">Postagens</button>
            <button class="tab" data-tab="times">Times</button>
            <button class="tab" data-tab="seguidores">Seguidores</button>
            <button class="tab" data-tab="seguindo">Seguindo</button>
          </div>

          <div class="tab-panel active" id="tab-postagens">
            <div class="loading-row">Carregando postagens...</div>
          </div>
          <div class="tab-panel" id="tab-times">
            <div class="loading-row">Carregando times...</div>
          </div>
          <div class="tab-panel" id="tab-seguidores">
            <div class="loading-row">Carregando seguidores...</div>
          </div>
          <div class="tab-panel" id="tab-seguindo">
            <div class="loading-row">Carregando...</div>
          </div>
        </main>
      </div>
    </div>

    <script src="/static/js/icons.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/posts.js"></script>
    <script src="/static/js/perfil.js"></script>
  </body>
</html>
