<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações — TheLocker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>
    <header class="topbar" id="topbar-mount"></header>

    <div class="content narrow">
      <main class="main-col" style="max-width:560px;">
        <h1 style="font-size:22px; margin-bottom:4px;">Configurações</h1>
        <p style="color:var(--text-dim); font-size:13.5px; margin:0 0 22px;">Gerencie os dados da sua conta.</p>

        <div class="form-error" id="form-error"></div>
        <div class="form-success" id="form-success"></div>

        <div class="card">
          <p class="card-title">Conta</p>
          <form id="config-form">
            <div class="field-row">
              <div class="field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
              </div>
              <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">
              </div>
            </div>

            <div id="campos-atleta" style="display:none;">
              <div class="field">
                <label for="bio">Bio</label>
                <textarea id="bio" maxlength="280" placeholder="Conte um pouco sobre você"></textarea>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="modalidade">Modalidade</label>
                  <input type="text" id="modalidade" placeholder="Ex: Natação">
                </div>
                <div class="field">
                  <label for="posicao">Posição</label>
                  <input type="text" id="posicao" placeholder="Ex: Ponta">
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="cidade">Cidade</label>
                  <input type="text" id="cidade">
                </div>
                <div class="field" style="max-width:100px;">
                  <label for="estado">UF</label>
                  <input type="text" id="estado" maxlength="2" style="text-transform:uppercase;">
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="data_nascimento">Nascimento</label>
                  <input type="date" id="data_nascimento">
                </div>
                <div class="field">
                  <label for="foto">URL da foto</label>
                  <input type="text" id="foto" placeholder="https://...">
                </div>
              </div>
            </div>

            <div class="field">
              <label for="senha">Nova senha <span class="hint">(deixe em branco para manter a atual)</span></label>
              <input type="password" id="senha" minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary" id="submit-btn">Salvar alterações</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/js/icons.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/config.js"></script>
</body>
</html>
