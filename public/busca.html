<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busca Avançada — TheLocker</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link
      rel="shortcut icon"
      href="./static/img/FaviconTlock.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar-mount"></aside>
      <header class="topbar" id="topbar-mount"></header>

      <div class="search-layout">
        <!-- Painel Lateral de Filtros -->
        <aside class="filter-sidebar card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 18px;
            "
          >
            <h2 style="font-size: 16px">Filtros Detalhados</h2>
            <button
              class="btn btn-ghost btn-sm"
              id="btn-reset-filtros"
              style="font-size: 11px; padding: 4px 8px"
            >
              Resetar
            </button>
          </div>

          <div class="filter-group">
            <h4>Modalidade</h4>
            <div class="filter-options" id="filter-modalidade">
              <button class="filter-btn" data-value="Futebol">Futebol</button>
              <button class="filter-btn" data-value="Futsal">Futsal</button>
              <button class="filter-btn" data-value="Basquete">Basquete</button>
              <button class="filter-btn" data-value="Vôlei">Vôlei</button>
              <button class="filter-btn" data-value="Handebol">Handebol</button>
            </div>
          </div>

          <div class="filter-group">
            <h4>Posição</h4>
            <div class="filter-options" id="filter-posicao">
              <button class="filter-btn" data-value="Atacante">Atacante</button>
              <button class="filter-btn" data-value="Meio-campo">
                Meio-campo
              </button>
              <button class="filter-btn" data-value="Defensor">Defensor</button>
              <button class="filter-btn" data-value="Goleiro">Goleiro</button>
              <button class="filter-btn" data-value="Armador">Armador</button>
              <button class="filter-btn" data-value="Pivô">Pivô</button>
              <button class="filter-btn" data-value="Líbero">Líbero</button>
            </div>
          </div>
        </aside>

        <!-- Área de Resultados Principal -->
        <main class="search-main">
          <div class="search-topbar card">
            <span style="font-size: 13.5px; font-weight: 600" id="busca-info"
              >A procurar...</span
            >
            <div class="view-toggles">
              <span
                style="
                  font-size: 12px;
                  color: var(--text-dim);
                  margin-right: 10px;
                "
                >Visualização:</span
              >
              <button class="btn btn-outline btn-sm active" id="btn-view-grid">
                Grid
              </button>
              <button class="btn btn-outline btn-sm" id="btn-view-list">
                Lista
              </button>
            </div>
          </div>

          <div class="search-grid" id="search-results-grid">
            <div class="loading-row">A carregar resultados...</div>
          </div>
        </main>
      </div>
    </div>

    <script src="/static/js/icons.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/busca.js"></script>
  </body>
</html>
