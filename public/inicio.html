<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início — The Locker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% include "partials/nav.html" %}

  <div class="wrap page-body" style="max-width:640px">

    <div class="composer">
      <div class="form-msg" data-composer-msg></div>
      <textarea id="post-texto" placeholder="Compartilhe um resultado, um treino ou uma novidade…"></textarea>
      <div class="composer-foot">
        <input type="url" id="post-imagem" placeholder="Link de uma imagem (opcional)">
        <button class="btn btn-primary btn-sm" type="button" data-publicar>Publicar</button>
      </div>
    </div>

    <div id="feed">
      <p class="skeleton">Carregando publicações…</p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    Locker.initNav();

    const feedEl = document.getElementById("feed");
    const composerMsg = document.querySelector("[data-composer-msg]");

    function postCardHtml(p) {
      const tipo = p.usuario.tipo;
      const foto = p.usuario.foto
        ? `<img class="avatar" src="${Locker.escapeHtml(p.usuario.foto)}" alt="">`
        : `<div class="avatar">${Locker.initials(p.usuario.nome)}</div>`;

      const imagem = p.imagem
        ? `<img class="post-img" src="${Locker.escapeHtml(p.imagem)}" alt="">`
        : "";

      const perfilUrl = tipo === "time"
        ? `/perfil/time/${p.usuario.id}`
        : `/perfil/usuario/${p.usuario.id}`;

      return `
        <article class="post tipo-${tipo}" data-post-id="${p.id}">
          ${foto}
          <div class="post-body">
            <div class="post-head">
              <a class="name" href="${perfilUrl}">${Locker.escapeHtml(p.usuario.nome)}</a>
              <span class="tag tipo-${tipo}">${Locker.tipoLabel(tipo)}</span>
              <span class="post-time">${Locker.timeAgo(p.data_criacao)}</span>
            </div>
            ${p.texto ? `<div class="post-text">${Locker.escapeHtml(p.texto)}</div>` : ""}
            ${imagem}
            <div class="post-actions">
              <button type="button" data-curtir class="${p.curtiu ? "is-active" : ""}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="${p.curtiu ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
                <span data-count>${p.curtidas}</span>
              </button>
              <button type="button" disabled>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                <span>${p.comentarios}</span>
              </button>
            </div>
          </div>
        </article>`;
    }

    async function carregarFeed() {
      // GET /feed/postagens (login_required) — junta publicacao + usuario + curtida/comentario
      const { ok, data } = await Locker.api("/feed/postagens");

      if (!ok) {
        feedEl.innerHTML = `<div class="empty-state"><strong>Não deu pra carregar o feed</strong>Tente atualizar a página.</div>`;
        return;
      }

      if (!data.length) {
        feedEl.innerHTML = `<div class="empty-state"><strong>Ainda não há nada por aqui</strong>Siga atletas e times ou publique algo pra começar.</div>`;
        return;
      }

      feedEl.innerHTML = data.map(postCardHtml).join("");
    }

    feedEl.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-curtir]");
      if (!btn) return;

      const article = btn.closest("[data-post-id]");
      const postId = article.dataset.postId;
      const countEl = btn.querySelector("[data-count]");
      const jaCurtiu = btn.classList.contains("is-active");

      // POST/DELETE /postagem/<id>/curtir
      const { ok } = await Locker.api(`/postagem/${postId}/curtir`, jaCurtiu ? "DELETE" : "POST");

      if (ok) {
        btn.classList.toggle("is-active");
        countEl.textContent = parseInt(countEl.textContent, 10) + (jaCurtiu ? -1 : 1);
        btn.querySelector("svg").setAttribute("fill", jaCurtiu ? "none" : "currentColor");
      }
    });

    document.querySelector("[data-publicar]").addEventListener("click", async () => {
      const texto = document.getElementById("post-texto").value.trim();
      const imagem = document.getElementById("post-imagem").value.trim();
      Locker.hideMsg(composerMsg);

      if (!texto && !imagem) {
        Locker.showMsg(composerMsg, "Escreva algo ou cole um link de imagem.");
        return;
      }

      // POST /postagem
      const { ok, data } = await Locker.api("/postagem", "POST", { texto, imagem: imagem || null });

      if (!ok) {
        Locker.showMsg(composerMsg, data.erro || "Não foi possível publicar.");
        return;
      }

      document.getElementById("post-texto").value = "";
      document.getElementById("post-imagem").value = "";
      carregarFeed();
    });

    carregarFeed();
  </script>
</body>
</html>
