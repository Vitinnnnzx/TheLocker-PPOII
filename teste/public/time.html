<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu time — TheLocker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>
    <header class="topbar" id="topbar-mount"></header>

    <div class="content narrow">
      <main class="main-col" style="max-width:680px;">
        <div id="time-conteudo">
          <div class="loading-row">Carregando seu time...</div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-excluir">
    <div class="modal-box">
      <h3>Excluir time</h3>
      <p>Essa ação é permanente e vai apagar a conta do time, incluindo o histórico de elenco. Não é possível desfazer.</p>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" id="cancelar-exclusao">Cancelar</button>
        <button class="btn btn-danger btn-sm" id="confirmar-exclusao">Excluir definitivamente</button>
      </div>
    </div>
  </div>

  <script src="/static/js/icons.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/time.js"></script>
</body>
</html>
