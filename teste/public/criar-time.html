<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar time — TheLocker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-visual">
      <a class="brand" href="/"><span class="brand-mark"></span>THE LOCKER</a>
      <div>
        <div class="tagline">Monte seu elenco e <span class="accent">organize sua equipe</span>.</div>
        <div class="stat-row" style="margin-top:26px;">
          <div class="stat"><b>Elenco</b><span>sempre atualizado</span></div>
          <div class="stat"><b>Histórico</b><span>de cada atleta</span></div>
        </div>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-box" style="max-width:380px;">
        <a class="auth-back" href="/"><span id="auth-back-icon"></span>Voltar ao início</a>
        <h1>Cadastrar time</h1>
        <p class="sub">Crie a conta da sua equipe para gerenciar o elenco.</p>

        <div class="form-error" id="form-error"></div>
        <div class="form-success" id="form-success"></div>

        <form id="time-form">
          <div class="field">
            <label for="nome">Nome do time</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Flamengo FC" required>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="contato@time.com" required autocomplete="email">
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="new-password">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade" placeholder="Camboriú">
            </div>
            <div class="field" style="max-width:100px;">
              <label for="estado">UF</label>
              <input type="text" id="estado" name="estado" placeholder="SC" maxlength="2" style="text-transform:uppercase;">
            </div>
          </div>
          <div class="field">
            <label for="escudo">URL do escudo <span class="hint">(opcional)</span></label>
            <input type="text" id="escudo" name="escudo" placeholder="https://...">
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Cadastrar time</button>
        </form>

        <div class="auth-switch">
          Já tem conta? <a href="/login">Entrar</a><br>
          É um atleta ou recrutador? <a href="/criar-conta">Criar conta pessoal</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/icons.js"></script>
  <script>
    document.getElementById("auth-back-icon").innerHTML = ICONS.arrowLeft;
  </script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/criar-time.js"></script>
</body>
</html>
